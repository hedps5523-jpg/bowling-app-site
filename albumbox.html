<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>기록앨범 보기</title>
<!-- 홈 화면의 '기록앨범' 박스 전용 보조 화면: 홈이 이 파일을 불러와 같은 출처 안에 끼워 넣어요(직접 열 일은 없어요).
     클럽 자료(조회 전용)를 읽어 기록앨범 한 장(최근 모임 · 월별 장부 · 회비 현황)을 그려 줘요. -->
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/club.css?v=20261123g">
<style>
html,body{margin:0;background:transparent;overflow:hidden;touch-action:pan-x pan-y} /* 브라우저 자체 두 손가락 확대는 막고 album.js 핀치로 그림만 확대 */
#abox{touch-action:pan-x pan-y}
.appbar,.bnav,#modal,#fileMenu,#toastc{display:none!important}
.wrap{padding:0;max-width:none}
#view{padding:0;margin:0}
#abox{position:relative;overflow:hidden;background:#fff}
#abox .alp{position:absolute;left:0;top:0;transform-origin:0 0}
#awrap{position:relative}
#aA{position:relative;overflow:hidden;background:#fff}
#aA .alp,#apin .alp{position:absolute;left:0;top:0;transform-origin:0 0}
#apin{position:relative;overflow:hidden;background:#fff;border-bottom:1px solid #d6e0ea}
.alp.alb .alp-body{padding-top:12px}
/* A영역(제목 배너·요약 카드): 글자와 여백을 최대한 줄여 B(표)가 더 많이 보이게 */
.alp.ala .alp-head{padding:12px 36px 10px;display:flex;align-items:baseline;gap:16px;flex-wrap:nowrap;white-space:nowrap}
.alp.ala .alp-club{font-size:24px}.alp.ala .alp-title{font-size:42px;margin:0;line-height:1.1}.alp.ala .alp-per{font-size:24px;margin:0 0 0 auto}
.alp.ala .alp-body{padding:8px 36px 0}
.alp.ala .alp-kpis{margin:0 0 6px;gap:10px}
.alp.ala .alp-kpi{padding:6px 4px;border-radius:14px}
.alp.ala .alp-kpi small{font-size:21px;line-height:1.25}.alp.ala .alp-kpi b{font-size:31px;margin-top:0;line-height:1.2}.alp.ala .alp-kpi em{font-size:18px;margin-top:0;line-height:1.2}
#abox.zpin{overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch}
.alp.alz .alp-body{padding-left:20px;padding-right:20px}
.alp.alz .alp-head{padding-left:24px;padding-right:24px}
.alp.alz .alp-foot{left:20px;right:20px}
.alp.alz .alp-t td{padding:7px 2px}.alp.alz .alp-t th{padding-top:9px;padding-bottom:9px}.alp.alz .alp-t td.a-right{padding-right:6px}.alp.alz .alp-t th{padding-left:1px;padding-right:1px}
.alp.alz .alp-pill{padding-left:9px;padding-right:9px;white-space:nowrap}
.alp.alz .alp-t td,.alp.alz .alp-t th{white-space:nowrap}.alp.alz .alp-t td.wr{white-space:normal}  /* 확대해도 표 글자는 한 줄(긴 비고만 줄바꿈 허용) */
.alp.alz .alp-kpis{gap:10px}
#ain{position:relative}
.abmsg{padding:18px 12px;text-align:center;color:#6b7f93;font-size:14px}
</style>
</head>
<body class="pc viewonly">
<div class="wrap">
  <div class="appbar"><div class="topbar"><b class="tb-title" id="appName"></b><button class="burger" id="burger" type="button" hidden>☰</button></div><div class="dim" id="dim" hidden></div><div class="dd" id="dd" hidden></div><div class="fix" id="fix"><div class="pchead" id="pchead" hidden><div class="pcnav" id="pcnav"></div><div class="pcsub" id="pcsub"></div><div class="pcwho"><span id="authStatus"></span><button type="button" class="pcbtn" id="logoutBtn">로그아웃</button></div></div></div></div>
  <main id="view"><p class="abmsg">불러오는 중…</p></main>
</div>
<div class="pcmodal" id="modal" hidden><div class="pcdlg" role="dialog" aria-modal="true"><div class="pcdlg-h" id="modalTitle"></div><div class="pcdlg-b" id="modalBody"></div><div class="pcdlg-f" id="modalFoot"></div></div></div>
<div class="pcmenu" id="fileMenu" hidden></div>
<div class="toastc" id="toastc" hidden></div>
<script>window.CLUB_VIEW_ONLY = true; window.ALBUM_BOX = true;</script>
<script src="/common.js"></script>
<script src="/club.js?v=20261123g"></script>
<script src="/album.js?v=20261127c"></script>
</body>
</html>
