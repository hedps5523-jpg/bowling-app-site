<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">

<title>설치 가능한 앱</title>
<meta name="description" content="Bowling APP 테스트 버전 사용 신청 안내">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <div class="appbar">
    <div class="brand"><div class="logo" aria-hidden="true">🎳</div><h1 id="appName">Bowling APP</h1></div>
    <nav class="top" aria-label="메뉴">
      <a href="/" aria-current="page">신청하기</a>
      <a href="/apps">내 앱 보기</a>
    </nav>
  </div>

    <section class="card">
    <h2>내 앱</h2>
    <div class="msg info" id="resMsg" role="status"></div>
    <div id="resList"></div>
    <div class="note">버튼을 눌러 <b>"테스터 되기"</b>를 수락한 뒤 Play 스토어에서 설치해 주세요. 신청한 계정으로 로그인되어 있어야 해요.</div>
    <a class="btn ghost" href="/apps" id="again" style="margin-top:8px">다른 이메일로 확인</a>
  </section>

  <section class="card">
    <h2>자주 묻는 질문</h2>
    <details><summary>설치 버튼이 안 보여요.</summary><p>테스터 수락 직후에는 스토어에 반영되기까지 몇 분~몇 시간 걸릴 수 있어요.</p></details>
    <details><summary>"사용할 수 없음"이 떠요.</summary><p>신청한 구글 계정과 다른 계정으로 로그인된 경우가 많아요. 신청한 계정으로 로그인했는지 확인해 주세요.</p></details>
  </section>
  <footer>© Bowling APP · 테스트 버전 안내 페이지</footer>
</div>
<script src="/common.js"></script>
<script>
fetch(fn("status"), { headers }).then((r) => r.json()).then((s) => { if (s.appName) $("appName").textContent = s.appName; }).catch(() => {});
let saved = null;
try { saved = JSON.parse(sessionStorage.getItem("myappsData") || "null"); } catch {}
if (!saved || !saved.d || !saved.d.approved) { location.replace("/apps"); }
else {
  const d = saved.d, msg = $("resMsg"), out = $("resList");
  msg.style.display = "block";
  if (!d.apps || !d.apps.length) {
    msg.textContent = d.waiting ? `승인되었어요. 앱 등록이 아직 끝나지 않았어요. (등록 준비 중 ${d.waiting}개) 잠시 후 다시 확인해 주세요.` : "승인되었어요. 설치 가능한 앱이 생기면 안내해 드려요.";
  } else {
    msg.textContent = `설치 가능한 앱 ${d.apps.length}개를 확인했어요.` + (d.waiting ? ` (등록 준비 중 ${d.waiting}개)` : "");
    for (const a of d.apps) {
      const card = el("div", "appitem");
      card.append(el("b", null, a.name));
      if (a.description) card.append(el("div", "d", a.description));
      if (typeof a.url === "string" && a.url.startsWith(PLAY_PREFIX)) {
        const l = el("a", "btn", "테스터 되기 · 설치하러 가기"); l.href = a.url; l.target = "_blank"; l.rel = "noopener"; card.append(l);
      }
      out.append(card);
    }
  }
  $("again").addEventListener("click", () => { try { sessionStorage.removeItem("myappsData"); } catch {} });
}
</script>
</body>
</html>
