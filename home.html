      <main id="view"><section class="card"><p class="tag">불러오는 중…</p></section></main>

<script src="/google.js"></script>
<script>
/* ---------- 도우미 ---------- */
function h(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") e.className = v;
    else if (k === "style") e.style.cssText = v;
    else if (k.startsWith("on")) e[k] = v;
    else if (v === true) e.setAttribute(k, "");
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const kid of kids.flat()) { if (kid == null || kid === false) continue; e.append(kid.nodeType ? kid : document.createTextNode(String(kid))); }
  return e;
}
const view = $("view");
let toastT;
function toast(t) { const e = $("toastc"); e.textContent = t; e.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => e.hidden = true, 3000); }
const DAYS = ["일", "월", "화", "수", "목", "금", "토"];
function fmt(iso, withDay = true) {
  if (!iso) return "";
  const d = new Date(iso); const p = (n) => String(n).padStart(2, "0");
  return `${d.getMonth() + 1}/${d.getDate()}${withDay ? "(" + DAYS[d.getDay()] + ")" : ""} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function dday(iso) {
  if (!iso) return null;
  const ms = new Date(iso).getTime() - Date.now();
  if (ms < 0) return "마감";
  const d = Math.ceil(ms / 86400e3);
  return d <= 1 ? "마감 임박" : `D-${d}`;
}
const initial = (n) => (n || "?").trim().slice(0, 1);
const staffOf = (role) => role === "admin" || role === "staff";
const ROLE = { admin: "관리자", staff: "운영진", member: "회원" };
// 실명 + 직함 (예: 홍길동 관리자). 이름이 비었거나 직함과 같으면 직함만.
function disp(name, role) {
  const r = role === "admin" ? "관리자" : role === "staff" ? "운영진" : role === "member" ? "정회원" : "";
  name = (name || "").trim();
  if (!r) return name;
  if (!name || name === r) return r;
  return name.endsWith(" " + r) ? name : `${name} ${r}`;
}

let token = "";
try { token = localStorage.getItem("authToken") || ""; } catch {}
async function api(action, data = {}) {
  const r = await fetch(fn("club"), { method: "POST", headers, body: JSON.stringify({ token, action, ...data }) });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401) { try { localStorage.removeItem("authToken"); } catch {} token = ""; guest("expired"); throw new Error("auth"); }
  if (r.status === 403 && d.error === "not_member") { await onboard(); throw new Error("auth"); }
  return { ok: r.ok, status: r.status, d };
}

/* ---------- 상단 바 / 하단 메뉴 ---------- */
function setBar(title, back) {
  $("fix").textContent = "";
  const left = document.querySelector(".tb-left");
  $("appName").textContent = title || "Bowling APP";
  if (back) { left.innerHTML = ""; left.append(h("span", {}, "‹ " + back.label)); left.setAttribute("href", back.href); }
  else { left.innerHTML = '<span class="lg">🎳</span>'; left.setAttribute("href", "#/"); }
}
function setNav(route) {
  $("bnav").hidden = !token;
  document.querySelectorAll("#bnav a").forEach((a) => a.classList.toggle("on", a.dataset.r === route));
}

/* ---------- 비회원 화면 ---------- */
function guest(reason) {
  $("bnav").hidden = true; setBar("Bowling APP");
  view.textContent = "";
  const c = h("section", { class: "card" }, h("h2", {}, "🎳 볼링 클럽 회원 가입"),
    h("p", { class: "lead" }, "Google 계정으로 로그인하면 클럽 가입과 테스트 앱 신청을 한 번에 할 수 있어요."));
  if (reason === "expired") c.append(h("div", { class: "msg info" }, "인증이 만료되었어요. 다시 로그인해 주세요."));
  else if (reason) c.append(h("div", { class: "msg err" }, googleErrorText(reason)));
  c.append(h("div", { style: "margin-top:14px" }, googleButton("Google로 시작하기")),
    h("small", { class: "mut", style: "display:block;margin-top:8px;text-align:center" }, "처음이면 가입 신청, 이미 회원이면 바로 클럽 화면이 열려요."),
    h("div", { class: "orline" }, "또는"),
    h("a", { class: "btn ghost", href: "/apps?next=%2Fhome" }, "이메일 인증번호로 들어가기"));
  view.append(c,
    h("section", { class: "card" }, h("h2", {}, "가입하면 이렇게 진행돼요"),
      h("ol", { class: "mut", style: "font-size:14px;line-height:1.9;padding-left:18px;margin:6px 0 0" },
        h("li", {}, "Google 로그인 → 이름 입력 → 가입 신청"),
        h("li", {}, "운영진이 승인하면 이 화면에서 바로 클럽 메뉴가 열려요"),
        h("li", {}, "테스트 앱도 신청했다면 등록 후 ☰ → 내 앱 보기에서 설치해요"))));
}

/* ---------- 가입 신청 / 승인 대기 ---------- */
async function signupApi(action, data = {}) {
  const r = await fetch(fn("signup"), { method: "POST", headers, body: JSON.stringify({ token, action, ...data }) });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401) { try { localStorage.removeItem("authToken"); } catch {} token = ""; guest("expired"); throw new Error("auth"); }
  return { ok: r.ok, d };
}
async function logout() {
  try { await fetch(fn("auth-verify"), { method: "POST", headers, body: JSON.stringify({ action: "logout", token }) }); } catch {}
  try { localStorage.removeItem("authToken"); } catch {}
  token = ""; location.hash = ""; guest();
}
const T_STATUS = { pending: ["승인 대기", "warn"], registered: ["등록 완료", "ok"], rejected: ["제외됨", "bad"] };
async function onboard(note) {
  $("bnav").hidden = true; setBar("회원 가입");
  const { d } = await signupApi("me");
  view.textContent = "";
  const m = d.member, t = d.tester;
  if (!m) return joinForm(d);
  const c = h("section", { class: "card" });
  if (m.status === "pending") c.append(h("h2", {}, "가입 신청이 접수됐어요 🙌"), h("p", { class: "lead" }, "운영진이 승인하면 이 화면에서 바로 클럽 메뉴가 열려요. 잠시만 기다려 주세요."));
  else c.append(h("h2", {}, "휴면 상태예요"), h("p", { class: "lead" }, "클럽 활동을 다시 시작하려면 운영진에게 말씀해 주세요."));
  if (note) c.append(h("div", { class: "msg info" }, note));
  const st = h("div", { style: "margin-top:12px" },
    h("div", { class: "strow" }, h("span", {}, "👤 클럽 회원"), h("span", { class: "pill " + (m.status === "pending" ? "warn" : "") }, m.status === "pending" ? "승인 대기" : "휴면")),
    h("div", { class: "strow" }, h("span", {}, "📲 테스트 앱"), t ? h("span", { class: "pill " + T_STATUS[t.status][1] }, T_STATUS[t.status][0]) : h("span", { class: "mut" }, "신청 안 함")));
  c.append(st, h("small", { class: "mut", style: "display:block;margin-top:6px" }, "로그인한 계정: " + d.email));
  if (t && t.status === "registered") c.append(h("a", { class: "btn", href: "/myapps", style: "margin-top:12px" }, "내 앱 보기 (설치 링크)"));
  c.append(h("button", { class: "btn ghost", type: "button", style: "margin-top:10px", onclick: () => onboard() }, "상태 새로고침"),
    h("button", { class: "btn ghost sm", type: "button", style: "margin-top:8px", onclick: logout }, "다른 계정으로 로그인"));
  view.append(c);
}
function joinForm(d) {
  let gName = ""; try { gName = sessionStorage.getItem("gName") || ""; } catch {}
  const name = h("input", { type: "text", maxlength: "50", placeholder: "클럽에서 쓸 이름 (닉네임)", value: (d.tester && d.tester.name) || gName });
  const avg = h("input", { type: "number", min: "0", max: "300", placeholder: "에버 (평균 점수, 선택)" });
  const wantT = h("input", { type: "checkbox" }), dev = h("input", { type: "text", maxlength: "100", placeholder: "기기 모델 (선택, 예: 갤럭시 S24)" });
  const devBox = h("div", { hidden: true }, dev);
  wantT.onchange = () => devBox.hidden = !wantT.checked;
  const agree = h("input", { type: "checkbox" });
  const msg = h("div", { class: "msg" });
  const go = h("button", { class: "btn", type: "button", style: "margin-top:14px" }, "가입 신청하기");
  const c = h("section", { class: "card" }, h("h2", {}, "회원 가입"),
    h("p", { class: "lead" }, "Google 계정 확인이 끝났어요. 이름만 입력하면 가입 신청이 돼요."),
    h("label", {}, "Google 계정"), h("input", { type: "text", value: d.email, disabled: true }),
    h("label", {}, "이름 *"), name, h("label", {}, "에버"), avg);
  if (d.tester && d.tester.status !== "rejected") c.append(h("div", { class: "msg info" }, `테스트 앱은 이미 신청되어 있어요 (${T_STATUS[d.tester.status][0]}).`));
  else if (d.testerAccepting) c.append(h("label", { class: "check" }, wantT, h("span", {}, "테스트 앱도 함께 신청할게요 ", h("small", { class: "mut" }, "(안드로이드 전용)"))), devBox);
  c.append(h("div", { class: "privacy" }, "수집 항목: 이름, Google 이메일, 에버(선택), 기기(선택)", h("br"), "이용 목적: 클럽 회원 관리, 공지·투표, 테스트 앱 배포", h("br"), "보관 기간: 탈퇴(삭제 요청) 시까지"),
    h("label", { class: "check" }, agree, h("span", {}, "개인정보 수집·이용에 동의합니다 (필수)")), msg, go,
    h("button", { class: "btn ghost sm", type: "button", style: "margin-top:8px", onclick: logout }, "다른 계정으로 로그인"));
  go.onclick = async () => {
    const say = (t) => { msg.className = "msg err"; msg.textContent = t; };
    if (!name.value.trim()) return say("이름을 입력해 주세요.");
    if (!agree.checked) return say("개인정보 수집·이용에 동의해 주세요.");
    go.disabled = true;
    try {
      const r = await signupApi("join", { name: name.value, avg_score: avg.value, consent: true, tester: wantT.checked, device: dev.value });
      if (!r.ok) { go.disabled = false; return say(r.d.error || "가입 신청을 하지 못했어요."); }
      await onboard(r.d.testerNote || null);
    } catch (e) { go.disabled = false; if (e.message !== "auth") say("잠시 후 다시 시도해 주세요."); }
  };
  view.append(c);
}

/* ---------- 홈 ---------- */
async function vHome() {
  setBar(); setNav("home");
  const { d } = await api("home");
  view.textContent = "";
  view.append(h("div", { class: "pagehead" }, h("p", { class: "tag" }, `${disp(d.me.name, d.me.role)}님, 안녕하세요 👋`), h("span", { class: "badge" }, `클럽 회원 ${d.memberCount}명`)));
  view.append(h("section", { class: "card" }, h("h2", {}, "빠른 메뉴"), h("div", { class: "grid4" },
    h("a", { class: "q", href: "#/members" }, h("b", {}, "👥"), "회원"), h("a", { class: "q", href: "#/lessons" }, h("b", {}, "🎓"), "강의"),
    h("a", { class: "q", href: "#/notices" }, h("b", {}, "📣"), "공지"), h("a", { class: "q", href: "#/notices" }, h("b", {}, "🗳️"), "투표")),
    h("div", { class: "grid4", style: "margin-top:8px" }, h("a", { class: "q", href: "/myapps" }, h("b", {}, "📲"), "내 앱"),
      d.me.role === "admin" ? h("a", { class: "q", href: "/admin" }, h("b", {}, "🔐"), "관리") : null)));
  const nx = d.next, c = h("section", { class: "card" }, h("h2", {}, "다음 모임"));
  if (!nx) c.append(h("p", { class: "tag" }, "예정된 모임이 없어요."));
  else {
    c.append(h("b", { style: "display:block" }, `${fmt(nx.event_at)}`), h("span", { class: "mut" }, `${nx.title}${nx.place ? " · " + nx.place : ""}`));
    if (nx.poll) {
      const tot = nx.poll.options.reduce((s, o) => s + o.count, 0), first = nx.poll.options[0];
      c.append(h("div", { class: "bar2" }, h("i", { style: `width:${tot && first ? Math.round(first.count / tot * 100) : 0}%` })),
        h("small", { class: "mut" }, nx.poll.options.map((o) => `${o.label} ${o.count}명`).join(" · ")));
    }
    c.append(h("a", { class: "btn", href: "#/notice/" + nx.id, style: "margin-top:10px" }, nx.poll && nx.poll.mineDone ? "투표 확인 · 바꾸기" : "투표하러 가기"));
  }
  view.append(c);
  const r = h("section", { class: "card" }, h("h2", {}, "최근 공지"));
  if (!d.recent.length) r.append(h("p", { class: "tag" }, "아직 공지가 없어요."));
  for (const n of d.recent) r.append(h("a", { class: "li", href: "#/notice/" + n.id }, n.pinned ? h("span", { class: "pin" }, "고정") : null, n.title));
  view.append(r, h("button", { class: "btn ghost sm", type: "button", style: "margin-top:14px", onclick: () => { if (confirm("이 기기에서 로그아웃할까요?")) logout(); } }, "로그아웃"));
}

/* ---------- 공지 · 투표 목록 ---------- */
async function vNotices() {
  setBar("공지 · 투표"); setNav("notices");
  const { d } = await api("notices");
  view.textContent = "";
  $("fix").append(h("div", { class: "hd" }, "공지 · 투표"));
  if (staffOf(d.role)) view.append(h("a", { class: "btn ghost sm", href: "#/new" }, "+ 공지·투표 올리기 (운영진)"));
  if (!d.notices.length) view.append(h("section", { class: "card" }, h("p", { class: "tag" }, "아직 공지가 없어요.")));
  for (const n of d.notices) {
    const dd = dday(n.deadline);
    const st = n.pollCount === 0 ? null : n.myDone >= n.pollCount ? h("span", { class: "pill ok" }, `투표 완료 ${n.myDone}/${n.pollCount}`) : h("span", { class: "pill bad" }, `투표 필요 ${n.myDone}/${n.pollCount}`);
    view.append(h("a", { class: "li", href: "#/notice/" + n.id },
      h("div", {}, n.pinned ? h("span", { class: "pin" }, "고정") : null, h("b", {}, n.title)),
      h("small", {}, `${fmt(n.created_at, false)}${n.event_at ? " · 모임 " + fmt(n.event_at) : ""}${dd ? " · " + dd : ""} `), st));
  }
}

/* ---------- 공지 상세 (투표 여러 개) ---------- */
async function vNotice(id) {
  setBar("공지 상세", { label: "공지", href: "#/notices" }); setNav("notices");
  const { ok, d } = await api("notice", { id });
  if (!ok) { view.textContent = ""; view.append(h("section", { class: "card" }, h("p", {}, d.error || "불러오지 못했어요."))); return; }
  const { notice: n, polls, waiting } = d;
  const open = polls.filter((p) => !p.closed);
  let editing = open.some((p) => !p.myDone);
  const sel = new Map(polls.map((p) => [p.id, new Set(p.options.filter((o) => o.mine).map((o) => o.id))]));
  let flash = history.state && history.state.flash;
  const staff = staffOf(d.role);

  function draw() {
    view.textContent = "";
    view.append(h("div", { style: "padding:14px 2px 2px" },
      n.pinned ? h("span", { class: "pin" }, "고정") : null,
      h("h2", { style: "font-size:19px;margin:6px 0" }, n.title),
      h("div", { class: "mut" }, `${disp(n.author, n.author_role) || "운영진"} · ${fmt(n.created_at, false)}`),
      n.event_at ? h("div", { style: "margin-top:6px;font-weight:600" }, `📅 ${fmt(n.event_at)}${n.place ? " · " + n.place : ""}`) : null,
      n.body ? h("p", { style: "font-size:14.5px;margin:8px 0;white-space:pre-wrap" }, n.body) : null,
      n.deadline ? h("span", { class: "pill " + (n.expired ? "" : "bad") }, n.expired ? "투표 마감됨" : `마감 ${fmt(n.deadline)} · ${dday(n.deadline)}`) : null));
    if (flash) view.append(h("div", { class: "banner ok" }, flash));
    const done = polls.filter((p) => p.myDone).length;
    if (polls.length) view.append(h("div", { style: "display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px" }, h("b", {}, `내 투표 ${done} / ${polls.length}`), h("div", { class: "bar2", style: "flex:1;margin:0" }, h("i", { style: `width:${polls.length ? done / polls.length * 100 : 0}%` }))));
    polls.forEach((p, i) => view.append(pollCard(p, i)));
    // 미투표 대기자
    const w = waiting;
    const wc = h("section", { class: "card" });
    if (w.count === 0) wc.append(h("b", {}, "🎉 모두 투표했어요"));
    else {
      wc.append(h("b", {}, `⏳ 미투표 대기자 ${w.count}명`), h("small", { class: "mut" }, ` / 전체 ${w.total}명`));
      wc.append(h("div", { style: "display:flex;flex-wrap:wrap;gap:6px;margin-top:8px" }, w.names.map((nm) => h("span", { class: "pill" }, nm))));
      if (w.meWaiting) wc.append(h("div", { class: "banner warn" }, "아직 내 투표가 끝나지 않았어요. 투표하면 이 명단에서 빠져요."));
    }
    if (n.exclude_rule === "any") wc.append(h("small", { class: "mut", style: "display:block;margin-top:6px" }, "※ 하나라도 투표하면 명단에서 제외돼요."));
    view.append(wc);
    if (editing && open.length) {
      const cnt = [...sel.entries()].filter(([pid, s]) => open.some((p) => p.id === pid) && s.size).length;
      const b = h("button", { class: "btn", type: "button", style: "margin-top:8px", disabled: cnt === 0 }, `투표 제출 (${cnt}/${open.length})`);
      b.onclick = submit; view.append(b);
    } else if (open.length) {
      view.append(h("button", { class: "btn ghost", type: "button", style: "margin-top:8px", onclick: () => { editing = true; flash = null; draw(); } }, "투표 다시 하기"));
    }
    if (staff) {

/* ---------- 미투표 현황 (운영진) ---------- */

  setBar("미투표 현황", { label: "공지", href: "#/notice/" + id }); setNav("notices");
  const { ok, d } = await api("waiting", { id });
  view.textContent = "";
  if (!ok) { view.append(h("section", { class: "card" }, d.error || "권한이 없어요.")); return; }
  let filter = "all";
  function draw() {
    view.textContent = "";
    view.append(h("div", { class: "hd" }, "미투표 대기자 ", h("small", {}, "운영진")),
      h("section", { class: "card" }, h("div", { style: "display:flex;align-items:baseline;gap:6px" }, h("b", { style: "font-size:34px;color:var(--err)" }, String(d.waiting.length)), h("span", { class: "mut" }, `/ ${d.total}명 미투표`)),
        h("div", { class: "bar2" }, h("i", { style: `width:${d.total ? d.waiting.length / d.total * 100 : 0}%` })), h("small", { class: "mut" }, `${d.total - d.waiting.length}명은 투표를 마쳐서 자동으로 명단에서 빠졌어요.`)));

    view.append(h("div", { class: "chips" }, h("button", { class: "chip2" + (filter === "all" ? " on" : ""), type: "button", onclick: () => { filter = "all"; draw(); } }, `전체 ${d.waiting.length}`),
      d.polls.map((p) => h("button", { class: "chip2" + (filter === p.id ? " on" : ""), type: "button", onclick: () => { filter = p.id; draw(); } }, `${p.title.slice(0, 8)} ${left(p.id)}`))));
    const rows = d.waiting.filter((w) => filter === "all" || w.polls.some((p) => p.id === filter && !p.done));
    if (!rows.length) view.append(h("section", { class: "card" }, "대기자가 없어요. 🎉"));
    for (const w of rows) {
      const b = h("button", { class: "xbtn", type: "button" }, "알림");
      b.onclick = async () => { b.disabled = true; const r = await api("remind", { id, member_id: w.id }); toast(r.ok ? (r.d.sent ? "알림 메일을 보냈어요." : "메일을 보내지 못했어요.") : (r.d.error || "보내지 못했어요.")); b.disabled = false; };
      view.append(h("div", { class: "li", style: "display:flex;justify-content:space-between;align-items:center;gap:8px" }, h("div", {}, h("b", {}, w.name), h("div", { style: "margin-top:4px;display:flex;gap:4px;flex-wrap:wrap" },

    }

    all.onclick = async () => { if (!confirm(`${d.waiting.length}명에게 알림 메일을 보낼까요?`)) return; all.disabled = true; const r = await api("remind", { id }); toast(r.ok ? `${r.d.sent}명에게 보냈어요.${r.d.failed ? " (실패 " + r.d.failed + ")" : ""}` : (r.d.error || "보내지 못했어요.")); all.disabled = false; };

/* ---------- 라우터 ---------- */
let gErr = null;
async function route() {
  if (!token) return guest(gErr);
  const hash = location.hash.replace(/^#/, "") || "/";
  const [, r, arg] = hash.split("/");
  window.scrollTo(0, 0);
  try {
    if (!r) await vHome();
    else if (r === "notices") await vNotices();
    else if (r === "notice" && arg) await vNotice(arg);
    else if (r === "new") await vNew();
    else if (r === "waiting" && arg) await vWaiting(arg);
    else if (r === "members") await vMembers();
    else if (r === "lessons") await vLessons();
    else await vHome();
  } catch (e) { if (e.message !== "auth") { view.textContent = ""; view.append(h("section", { class: "card" }, h("p", {}, "불러오지 못했어요. 잠시 후 새로고침해 주세요."))); } }
}
window.addEventListener("hashchange", () => { history.replaceState(null, ""); route(); });
(async () => {
  const g = await googleFinish();
  if (g && g.token) token = g.token; else if (g && g.error) gErr = g.error;
  route();
})();
